AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Personal Trainer — SaaS serverless (FastAPI + DynamoDB + Cognito + W-API)"

# Conta: 421219980792 (pessoal-hotmail) | Region: us-east-1 | Stack: personal-trainer-prod
# Padrões: ARCHITECTURE.md (genérico) + ESPEC_TECNICA.md (modelo deste produto).

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  ProjectName:
    Type: String
    Default: personal-trainer
  WebhookSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Token opaco que protege o endpoint público do webhook W-API (ESPEC §7)."
  WapiBaseUrl:
    Type: String
    Default: "https://api.w-api.app"
  WebhookBaseUrl:
    Type: String
    Default: ""
    Description: "Base pública da API (execute-api) p/ auto-configurar o webhook na W-API. Evita dependência circular com o ApiGateway."
  FrontendUrl:
    Type: String
    Default: ""
    Description: "URL do portal (coachpilot.com.br) — p/ links de cadastro e uso geral."
  AlunoFrontendUrl:
    Type: String
    Default: "https://app.coachpilot.com.br"
    Description: "URL do subdomínio do app do aluno — p/ magic-link enviado pelo WhatsApp."
  OpenAiApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "API Key da OpenAI — key SEPARADA deste app (custo isolado)."
  OpenAiModel:
    Type: String
    Default: "gpt-5.4-nano"
  LlmProvider:
    Type: String
    Default: "openai"
    AllowedValues: ["openai", "fusion"]
    Description: "Provider do agente — trocar é reversível (sem mudar código), só este parâmetro."
  FusionApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Token do gateway interno Fusion LLM (formato Azure OpenAI) — só usado quando LlmProvider=fusion."
  FusionBaseUrl:
    Type: String
    Default: "https://fusion-llm.brq.com"
  FusionApiVersion:
    Type: String
    Default: "2025-03-01-preview"
  DeployFrontendInfra:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  DomainName:
    Type: String
    Default: "coachpilot.com.br"
    Description: "Domínio apex custom do frontend (Route53 + ACM + CloudFront alias)."
  AdminSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Chave para o header X-Admin-Key — protege POST /v1/wapi/config + assina tokens de impersonação."
  AdminEmail:
    Type: String
    Default: "admin@coachpilot.com.br"
    Description: "Email do superadmin — único usuário que pode chamar /v1/admin/* e usar impersonação."
  VapidPrivateKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Chave privada VAPID (PEM, newlines escapados como \\n) para Web Push notifications."
  VapidPublicKey:
    Type: String
    Default: ""
    Description: "Chave pública VAPID (base64url, 65 bytes) — exposta ao frontend para applicationServerKey."
  VapidSubject:
    Type: String
    Default: "mailto:admin@coachpilot.com.br"
    Description: "Email de contato para o servidor de push (sub do JWT VAPID)."
  MlAccessToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Access Token Mercado Pago DA PLATAFORMA — cobra o personal pela assinatura (Gestão Pro). Distinto do token que cada personal configura para cobrar seus próprios alunos."
  PromoCodeSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Segredo compartilhado com o FinPilot para geração de códigos promocionais (HMAC-SHA256). Gerado com openssl rand -hex 32."
  PacoteSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Segredo HMAC-SHA256 para assinar e validar arquivos .cpkg. Gerado com: openssl rand -hex 32."
  McpTokenSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Assina os access tokens OAuth do servidor MCP (HS256). Gerado com: openssl rand -hex 32."
  OpenaiAppsChallenge:
    Type: String
    Default: ""
    Description: "Token de verificacao de dominio da submissao de app do ChatGPT. Servido em texto puro em mcp.{dominio}/.well-known/openai-apps-challenge."

Conditions:
  CreateFrontendInfra: !Equals [!Ref DeployFrontendInfra, "true"]

Globals:
  Function:
    Timeout: 29          # alinhado ao limite do HTTP API
    MemorySize: 1024     # reduz cold start ~5s→1.8s; duration free tier cobre até ~520 personais
    Runtime: python3.12
    Architectures: [arm64]
    Tags:
      Project: personal-trainer
      Owner: vinicius
      ManagedBy: SAM
    Environment:
      Variables:
        TABLE_NAME: !Ref MainTable
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_REGION: !Ref AWS::Region
        STAGE: !Ref Stage
        WAPI_BASE_URL: !Ref WapiBaseUrl
        WEBHOOK_SECRET: !Ref WebhookSecret
        WEBHOOK_BASE_URL: !Ref WebhookBaseUrl
        FRONTEND_URL: !Ref FrontendUrl
        ALUNO_FRONTEND_URL: !Ref AlunoFrontendUrl
        MEDIA_BUCKET_NAME: !Sub "${ProjectName}-media-${Stage}-${AWS::AccountId}"
        OPENAI_API_KEY: !Ref OpenAiApiKey
        OPENAI_MODEL: !Ref OpenAiModel
        LLM_PROVIDER: !Ref LlmProvider
        FUSION_API_KEY: !Ref FusionApiKey
        FUSION_BASE_URL: !Ref FusionBaseUrl
        FUSION_API_VERSION: !Ref FusionApiVersion
        ADMIN_SECRET: !Ref AdminSecret
        ADMIN_EMAIL: !Ref AdminEmail
        VAPID_PRIVATE_KEY: !Ref VapidPrivateKey
        VAPID_PUBLIC_KEY: !Ref VapidPublicKey
        VAPID_SUBJECT: !Ref VapidSubject
        ML_ACCESS_TOKEN: !Ref MlAccessToken
        PROMO_CODE_SECRET: !Ref PromoCodeSecret
        PACOTE_SECRET: !Ref PacoteSecret
        MCP_TOKEN_SECRET: !Ref McpTokenSecret
        MCP_SERVER_URL: !Sub "https://mcp.${DomainName}"
        OPENAI_APPS_CHALLENGE: !Ref OpenaiAppsChallenge

Resources:

  # ── myApplications (AWS AppRegistry) — custo isolado por app ──────────────────
  TrainerApp:
    Type: AWS::ServiceCatalogAppRegistry::Application
    Properties:
      Name: !Sub "${ProjectName}-${Stage}"
      Description: "Personal Trainer — portal + agente WhatsApp serverless"
      Tags:
        Project: personal-trainer
        Owner: vinicius
        Stage: !Ref Stage
        ManagedBy: SAM

  AppStackAssociation:
    Type: AWS::ServiceCatalogAppRegistry::ResourceAssociation
    Properties:
      Application: !GetAtt TrainerApp.Id
      Resource: !Ref AWS::StackId
      ResourceType: CFN_STACK

  # ── Cognito (apenas o PERSONAL autentica — ESPEC §1.1) ───────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users-${Stage}"
      UserPoolTags:
        Project: personal-trainer
        Owner: vinicius
        Stage: !Ref Stage
        ManagedBy: SAM
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-web-${Stage}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      # Removido (não bastou) e definido explicitamente: CloudFormation não reseta pra default
      # quando a propriedade só é omitida — precisa do valor explícito pra sair de ENABLED.
      PreventUserExistenceErrors: LEGACY
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH   # auth via CLI (testes/automação)
        - ALLOW_REFRESH_TOKEN_AUTH

  # ── API Gateway HTTP v2 (JWT authorizer nativo) ──────────────────────────────
  ApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization, X-Impersonate]
        AllowOrigins: ["*"]
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  # ── Lambda FastAPI (monolambda) ──────────────────────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.main.handler
      CodeUri: ./
      Description: "Personal Trainer API (FastAPI + Mangum)"
      FunctionUrlConfig:           # webhook W-API bate direto aqui — sem custo de API Gateway
        AuthType: NONE
        Cors:
          AllowMethods: [POST]
          AllowOrigins: ["*"]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - S3CrudPolicy:
            BucketName: !Sub "${ProjectName}-media-${Stage}-${AWS::AccountId}"
        - Statement:
            - Effect: Allow
              Action: cognito-idp:ListUsers
              Resource: !GetAtt UserPool.Arn
      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /v1/health
            Method: GET
            Auth:
              Authorizer: NONE
        PublicProxy:           # webhook W-API e demais rotas sem Cognito (ESPEC §7)
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /v1/public/{proxy+}
            Method: ANY
            Auth:
              Authorizer: NONE
        AlunoProxy:            # app do aluno: JWT escopado validado na Lambda (ESPEC §1.5)
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /v1/aluno/{proxy+}
            Method: ANY
            Auth:
              Authorizer: NONE
        PreviewProxy:          # /token/{token} — preview público p/ WhatsApp (sem Cognito)
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /token/{token}
            Method: GET
            Auth:
              Authorizer: NONE
        AuthProxy:             # todo o resto exige JWT do personal
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /{proxy+}
            Method: ANY

  # ── Servidor MCP (mcp.coachpilot.com.br) ─────────────────────────────────────
  # API e Lambda SEPARADAS do portal de propósito:
  #  • o Bearer aqui é nosso (HS256), não do Cognito — a API principal tem
  #    DefaultAuthorizer Cognito e um catch-all /{proxy+}, que atrapalhariam;
  #  • o tráfego é rajada longa de leitura vinda de LLM, perfil oposto ao do portal;
  #  • subdomínio próprio porque o OAuth exige /.well-known na RAIZ do issuer, e no
  #    domínio principal a SpaRouterFunction manda qualquer path com ponto para o S3.
  McpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default        # sem prefixo de stage no path — Mangum não precisa recortar
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Content-Type, Authorization, MCP-Protocol-Version]
        ExposeHeaders: [WWW-Authenticate, MCP-Protocol-Version]
      Tags:
        Project: personal-trainer
        ManagedBy: SAM

  McpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.mcp.asgi.handler
      CodeUri: ./
      Description: "Servidor MCP — ChatGPT/Claude/Gemini falam direto com os dados do personal"
      Policies:
        - DynamoDBCrudPolicy:      # sem S3 e sem Cognito: o MCP não precisa de nenhum dos dois
            TableName: !Ref MainTable
      Events:
        McpProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref McpApi
            Path: /{proxy+}
            Method: ANY

  McpDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: CreateFrontendInfra
    Properties:
      DomainName: !Sub "mcp.${DomainName}"
      DomainNameConfigurations:
        - CertificateArn: !Ref SiteCertificate    # o wildcard *.${DomainName} já cobre
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
      Tags:
        Project: personal-trainer
        ManagedBy: SAM

  McpApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: CreateFrontendInfra
    # O stage é criado pelo SAM a partir de StageName acima; como só o referenciamos pelo
    # nome (string, não !Ref), o CloudFormation não infere a ordem e tentaria mapear antes
    # de ele existir → "Invalid stage identifier".
    DependsOn: McpApiApiGatewayDefaultStage
    Properties:
      ApiId: !Ref McpApi
      DomainName: !Ref McpDomainName
      Stage: $default

  McpDnsRecordA:
    Type: AWS::Route53::RecordSet
    Condition: CreateFrontendInfra
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub "mcp.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt McpDomainName.RegionalDomainName
        HostedZoneId: !GetAtt McpDomainName.RegionalHostedZoneId

  # ── Scheduler (EventBridge diário — vencimentos de treino) ───────────────────
  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.scheduler.handler
      CodeUri: ./
      Description: "Notifica o personal sobre treinos vencendo (diário)"
      Timeout: 60        # processa lote (30 dias x partições) — 29s do Globals (CRUD) não basta
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 * * ? *)   # 09:00 UTC, diariamente
            Name: !Sub "${ProjectName}-scheduler-${Stage}"
            Enabled: true

  # ── Agenda Notif Scheduler (EventBridge 5 min — lembretes de sessão) ────────
  AgendaNotifFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.agenda_scheduler.handler
      CodeUri: ./
      Description: "Envia lembretes de sessão 15 min antes do evento (a cada 5 min)"
      Timeout: 60
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        Every5Min:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: !Sub "${ProjectName}-agenda-notif-${Stage}"
            Enabled: true

  # ── Sessão Scheduler (EventBridge 5 min — sessão de treino esquecida aberta) ─
  # Lambda separada do AgendaNotif de propósito: uma exceção varrendo sessões não pode
  # derrubar os lembretes de aula, e vice-versa.
  SessaoSchedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.sessao_scheduler.handler
      CodeUri: ./
      Description: "Avisa em 4h e finaliza sozinha em 6h a sessão de treino deixada aberta"
      Timeout: 60
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        Every5Min:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: !Sub "${ProjectName}-sessao-sched-${Stage}"
            Enabled: true

  # ── DynamoDB (single-table — ESPEC §2) ───────────────────────────────────────
  # GSI1 = "registros por exercício no tempo" (ESPEC §2.3/§4.1).
  # Projection ALL por ora; refinar p/ INCLUDE quando os atributos congelarem.
  # DynamoDB Streams p/ indicadores Nível B (ESPEC §3.1 / ARCHITECTURE §5.5): habilitar quando precisar.
  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Stage}"
      BillingMode: PAY_PER_REQUEST
      Tags:
        - { Key: Project, Value: personal-trainer }
        - { Key: Owner, Value: vinicius }
        - { Key: Stage, Value: !Ref Stage }
        - { Key: ManagedBy, Value: SAM }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── S3 Media (mídia recebida da W-API; link da W-API expira — ESPEC §7) ──────
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-media-${Stage}-${AWS::AccountId}"
      Tags:
        - { Key: Project, Value: personal-trainer }
        - { Key: ManagedBy, Value: SAM }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [GET, PUT]
            AllowedHeaders: ["*"]
            MaxAge: 3600

  # ── Layer com ffmpeg estático (arm64) para o transcode de vídeo ──────────────
  # Conteúdo local (layers/ffmpeg/bin/ffmpeg) — SAM empacota e sobe no deploy.
  # /opt é read-only e o zip vem do Windows sem bit +x: a Lambda copia o binário
  # pra /tmp e dá chmod lá (ver app/transcode.py).
  FfmpegLayer:
    Type: AWS::Serverless::LayerVersion
    DeletionPolicy: Delete
    Properties:
      LayerName: !Sub "${ProjectName}-ffmpeg-${Stage}"
      Description: "ffmpeg estático (arm64) para transcode de vídeo pós-upload"
      ContentUri: ./layers/ffmpeg/
      CompatibleArchitectures: [arm64]
      CompatibleRuntimes: [python3.12]

  # ── Transcode de vídeo (evento S3 no upload → comprime 720p+faststart in-place) ─
  TranscodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.transcode.handler
      CodeUri: ./
      Description: "Comprime vídeo (H.264 720p + faststart) e regrava no mesmo s3_key"
      Timeout: 600            # clipes curtos; margem p/ inputs grandes
      MemorySize: 3008        # teto da conta (limite Lambda) — ~2 vCPU, suficiente p/ transcode
      EphemeralStorage:
        Size: 2048            # /tmp: binário + input + output
      Layers:
        - !Ref FfmpegLayer
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub "${ProjectName}-media-${Stage}-${AWS::AccountId}"
      Events:
        VideoUpload:
          Type: S3
          Properties:
            Bucket: !Ref MediaBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: midia/

  # ── CloudFront Function: roteia rotas SPA ao HTML correto antes do S3 ────────
  SpaRouterFunction:
    Type: AWS::CloudFront::Function
    Condition: CreateFrontendInfra
    Properties:
      Name: !Sub "${ProjectName}-spa-router-${Stage}"
      AutoPublish: true
      FunctionConfig:
        Comment: "301 www->apex e /aluno*//loja* p/ subdominios; rotas prerenderizadas -> /<rota>/index.html; demais SPA -> index.html"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function buildQs(request) {
          var parts = [];
          var qs = request.querystring;
          for (var k in qs) {
            if (Object.prototype.hasOwnProperty.call(qs, k)) {
              var mv = qs[k].multiValue;
              if (mv) {
                for (var i = 0; i < mv.length; i++) parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(mv[i].value));
              } else {
                parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(qs[k].value));
              }
            }
          }
          return parts.length ? '?' + parts.join('&') : '';
        }
        // Rotas com HTML prerenderizado no S3 (dist/<rota>/index.html) — manter em
        // sincronia com frontend/scripts/prerender-public-pages.mjs. Sem esta lista,
        // o crawler recebe o shell da home em todas as URLs (SEO quebrado).
        var PRERENDERED = {
          '/divulgadores': 1, '/software-para-personal-trainer': 1, '/app-para-personal-trainer': 1,
          '/ia-para-personal-trainer': 1, '/chatgpt-para-personal-trainer': 1,
          '/gestao-de-alunos-personal-trainer': 1, '/app-de-treino-para-alunos': 1,
          '/avaliacao-fisica-digital': 1, '/agenda-para-personal-trainer': 1,
          '/whatsapp-para-personal-trainer': 1, '/coachpilot-vs-planilhas': 1,
          '/precos': 1, '/faq': 1, '/sobre': 1, '/termos': 1, '/privacidade': 1, '/blog': 1
        };
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var host = request.headers.host && request.headers.host.value;
          if (host === 'www.coachpilot.com.br') {
            return { statusCode: 301, headers: { location: { value: 'https://coachpilot.com.br' + uri + buildQs(request) }, 'cache-control': { value: 'max-age=86400' } } };
          }
          if (uri === '/loja' || uri.indexOf('/loja/') === 0 || uri.indexOf('/loja?') === 0) {
            return { statusCode: 301, headers: { location: { value: 'https://loja.coachpilot.com.br' }, 'cache-control': { value: 'no-store' } } };
          }
          if (uri === '/aluno' || uri.indexOf('/aluno/') === 0 || uri.indexOf('/aluno?') === 0) {
            var loc = 'https://app.coachpilot.com.br' + uri + buildQs(request);
            return { statusCode: 301, headers: { location: { value: loc }, 'cache-control': { value: 'no-store' } } };
          }
          var path = uri.length > 1 && uri[uri.length - 1] === '/' ? uri.slice(0, -1) : uri;
          if (path.indexOf('.') === -1 && (PRERENDERED[path] === 1 || path.indexOf('/blog/') === 0)) {
            request.uri = path + '/index.html';
            return request;
          }
          if (uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  # ── CloudFront Function para o app do aluno (app.coachpilot.com.br) ──────────
  AlunoSpaRouterFunction:
    Type: AWS::CloudFront::Function
    Condition: CreateFrontendInfra
    Properties:
      Name: !Sub "${ProjectName}-aluno-router-${Stage}"
      AutoPublish: true
      FunctionConfig:
        Comment: "SPA do aluno: assets pass-through, todo o resto serve aluno.html"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var uri = event.request.uri;
          if (uri.lastIndexOf('.') > uri.lastIndexOf('/')) return event.request;
          event.request.uri = '/aluno.html';
          return event.request;
        }

  # ── CloudFront Function para a loja (loja.coachpilot.com.br) ─────────────────
  LojaSpaRouterFunction:
    Type: AWS::CloudFront::Function
    Condition: CreateFrontendInfra
    Properties:
      Name: !Sub "${ProjectName}-loja-router-${Stage}"
      AutoPublish: true
      FunctionConfig:
        Comment: "SPA da loja: assets pass-through, todo o resto serve loja.html"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var uri = event.request.uri;
          if (uri.lastIndexOf('.') > uri.lastIndexOf('/')) return event.request;
          event.request.uri = '/loja.html';
          return event.request;
        }

  # ── CloudFront Function para o painel do divulgador (divulgador.coachpilot.com.br) ──
  DivulgadorSpaRouterFunction:
    Type: AWS::CloudFront::Function
    Condition: CreateFrontendInfra
    Properties:
      Name: !Sub "${ProjectName}-divulgador-router-${Stage}"
      AutoPublish: true
      FunctionConfig:
        Comment: "SPA do divulgador: assets pass-through, todo o resto serve divulgador.html"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var uri = event.request.uri;
          if (uri.lastIndexOf('.') > uri.lastIndexOf('/')) return event.request;
          event.request.uri = '/divulgador.html';
          return event.request;
        }

  # Cache curto do catálogo público da loja: absorve o tráfego de leitura no edge
  # (GETs sem auth) — o Dynamo/Lambda recebem no máximo ~1 req/min por variação.
  LojaCatalogoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: CreateFrontendInfra
    Properties:
      CachePolicyConfig:
        Name: !Sub "${ProjectName}-loja-catalogo-${Stage}"
        Comment: "Catalogo publico da loja — TTL curto, query strings na cache key"
        DefaultTTL: 60
        MinTTL: 30
        MaxTTL: 120
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }

  # ── S3 + CloudFront (frontend SPA — criar quando a conta estiver pronta) ─────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Condition: CreateFrontendInfra
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${Stage}-${AWS::AccountId}"
      Tags:
        - { Key: Project, Value: personal-trainer }
        - { Key: ManagedBy, Value: SAM }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateFrontendInfra
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn:
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AlunoCloudFrontDistribution}"
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${LojaCloudFrontDistribution}"
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DivulgadorCloudFrontDistribution}"

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: CreateFrontendInfra
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  HostedZone:
    Type: AWS::Route53::HostedZone
    Condition: CreateFrontendInfra
    Properties:
      Name: !Ref DomainName
      HostedZoneTags:
        - { Key: Project, Value: personal-trainer }
        - { Key: ManagedBy, Value: SAM }

  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateFrontendInfra
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
        - !Sub "*.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZone
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZone
      Tags:
        - { Key: Project, Value: personal-trainer }
        - { Key: ManagedBy, Value: SAM }

  ApexAliasRecordA:
    Type: AWS::Route53::RecordSet
    Condition: CreateFrontendInfra
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  ApexAliasRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: CreateFrontendInfra
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwAliasRecordA:
    Type: AWS::Route53::RecordSet
    Condition: CreateFrontendInfra
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwAliasRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: CreateFrontendInfra
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  AppAliasRecordA:
    Type: AWS::Route53::RecordSet
    Condition: CreateFrontendInfra
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub "app.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt AlunoCloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  AppAliasRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: CreateFrontendInfra
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub "app.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt AlunoCloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  LojaAliasRecordA:
    Type: AWS::Route53::RecordSet
    Condition: CreateFrontendInfra
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub "loja.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt LojaCloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  LojaAliasRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: CreateFrontendInfra
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub "loja.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt LojaCloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  DivulgadorAliasRecordA:
    Type: AWS::Route53::RecordSet
    Condition: CreateFrontendInfra
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub "divulgador.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt DivulgadorCloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  DivulgadorAliasRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: CreateFrontendInfra
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub "divulgador.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt DivulgadorCloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateFrontendInfra
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref SiteCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}
          - Id: ApiOrigin
            DomainName: !Sub "${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: !Sub "/${Stage}"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          AllowedMethods: [GET, HEAD]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouterFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /v1/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }

  AlunoCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateFrontendInfra
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: aluno.html
        Aliases:
          - !Sub "app.${DomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref SiteCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}
          - Id: ApiOrigin
            DomainName: !Sub "${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: !Sub "/${Stage}"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          AllowedMethods: [GET, HEAD]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt AlunoSpaRouterFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /v1/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
          - PathPattern: /token/*       # preview WhatsApp → API (sem SpaRouter, p/ não cair no aluno.html)
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            AllowedMethods: [GET, HEAD, OPTIONS]
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /aluno.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /aluno.html }

  LojaCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateFrontendInfra
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: loja.html
        Aliases:
          - !Sub "loja.${DomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref SiteCertificate   # wildcard *.coachpilot.com.br já cobre loja.
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}
          - Id: ApiOrigin
            DomainName: !Sub "${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: !Sub "/${Stage}"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          AllowedMethods: [GET, HEAD]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt LojaSpaRouterFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /v1/public/loja/*   # catálogo público — cache curto no edge (antes do /v1/*)
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: !Ref LojaCatalogoCachePolicy
            AllowedMethods: [GET, HEAD]
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
          - PathPattern: /v1/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /loja.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /loja.html }

  DivulgadorCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateFrontendInfra
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: divulgador.html
        Aliases:
          - !Sub "divulgador.${DomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref SiteCertificate   # wildcard *.coachpilot.com.br já cobre divulgador.
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}
          - Id: ApiOrigin
            DomainName: !Sub "${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: !Sub "/${Stage}"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          AllowedMethods: [GET, HEAD]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DivulgadorSpaRouterFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /v1/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /divulgador.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /divulgador.html }

Outputs:
  ApiUrl:
    Value: !Sub "${ApiGateway.ApiEndpoint}/${Stage}"
  McpServerUrl:
    Description: "URL para colar no ChatGPT/Claude/Gemini ao adicionar o conector"
    Value: !Sub "https://mcp.${DomainName}/mcp"
  McpApiEndpoint:
    Description: "Endpoint bruto do API Gateway do MCP (útil antes de o DNS propagar)"
    Value: !Ref McpApi
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref MainTable
  MediaBucketName:
    Value: !Ref MediaBucket
  WebhookUrlBase:
    Description: "Legado — API Gateway (não usar para webhook W-API, prefira WebhookFunctionUrl)"
    Value: !Sub "${ApiGateway.ApiEndpoint}/${Stage}"
  WebhookFunctionUrl:
    Description: "URL direta da Lambda para webhook W-API (sem custo de API Gateway). Usar: {WebhookFunctionUrl}v1/public/wapi/webhook/{WebhookSecret}"
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  CloudFrontUrl:
    Condition: CreateFrontendInfra
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  CloudFrontDistributionId:
    Condition: CreateFrontendInfra
    Value: !Ref CloudFrontDistribution
  HostedZoneNameServers:
    Condition: CreateFrontendInfra
    Description: "Colar estes NS no painel da revenda (DNS do domínio coachpilot.com.br)."
    Value: !Join [", ", !GetAtt HostedZone.NameServers]
  CertificateArn:
    Condition: CreateFrontendInfra
    Value: !Ref SiteCertificate
  CustomDomainUrl:
    Condition: CreateFrontendInfra
    Value: !Sub "https://${DomainName}"
  AlunoCloudFrontUrl:
    Condition: CreateFrontendInfra
    Value: !Sub "https://app.${DomainName}"
  AlunoCloudFrontDistributionId:
    Condition: CreateFrontendInfra
    Value: !Ref AlunoCloudFrontDistribution
  LojaCloudFrontUrl:
    Condition: CreateFrontendInfra
    Value: !Sub "https://loja.${DomainName}"
  LojaCloudFrontDistributionId:
    Condition: CreateFrontendInfra
    Value: !Ref LojaCloudFrontDistribution
  DivulgadorCloudFrontUrl:
    Condition: CreateFrontendInfra
    Value: !Sub "https://divulgador.${DomainName}"
  DivulgadorCloudFrontDistributionId:
    Condition: CreateFrontendInfra
    Value: !Ref DivulgadorCloudFrontDistribution
